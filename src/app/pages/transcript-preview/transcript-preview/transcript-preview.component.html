<div class="container" *ngIf="!downloadingTranscript">
    <!-- candidate data -->
    <div>
        <div class="d-flex align-items-center justify-content-between">
            <h4 class="mt-3">TRANSCRIPT</h4>
        </div>
        <div class="d-flex justify-content-between align-items-center py-3 border-bottom">
            <div class="d-flex gap-5 justify-content-between align-items-center">
                <div class="d-flex gap-2 align-items-center">
                    <div
                        class="rounded-circle d-flex flex-colum align-items-center justify-content-center bg-soft-secondary"
                        style="width: 50px; height: 50px">
                        <span class="fs-12 fw-bold text-uppercase">
                          {{ params.name?.substr(0, 2)?.toUpperCase() }}
                        </span>
                    </div>
                    <div>
                        <div class="fs-14 fw-bold" *ngIf="params?.name"> {{ params.name }} </div>
                        <span class="small" *ngIf="params?.loginField"> {{ params.loginField }} </span>
                    </div>
                </div>
                <div class="d-flex justify-content-between gap-3">
                    <div>
                        <h6>Total questions</h6>
                        <div class="small fw-bold fs-12"> {{ transcriptData?.length ?? 0 }} </div>
                    </div>
                    <div>
                        <h6>Score</h6>
                        <div class="small fw-bold fs-12"> {{ transcriptScore }} </div>
                    </div>
                </div>
            </div>
            <div>
                <div class="d-flex align-items-center gap-1">
                    <div class="small" *ngIf="params?.sectionName"> {{ params.sectionName }} </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Question -->
    <ng-container *ngFor="let item of transcriptData; let i = index">
        <!-- MCQ -->
        <mcq 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.MCQ"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></mcq>

        <!-- CLOZE_DROPDOWN -->
        <app-close-dropdown 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.CLOZE_DROPDOWN"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-close-dropdown>

        <!-- CLOZE_TEXT -->
        <app-cloze-text 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.CLOZE_TEXT"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-cloze-text>

        <!-- CLOZE_RADIO -->
        <app-cloze-radio 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.CLOZE_RADIO"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-cloze-radio>

        <!-- TRUE_FALSE -->
        <app-true-or-false 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.TRUE_FALSE"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-true-or-false>

        <!-- YES_NO -->
        <app-yes-or-no 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.YES_NO"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-yes-or-no>

        <!-- ASSOCIATION -->
        <app-matching 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.ASSOCIATION"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-matching>

        <!-- ORDER_LIST -->
        <app-ordering 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.ORDER_LIST"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-ordering>

        <!-- MRQ -->
        <app-mrq 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.MRQ"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-mrq>

        <!-- SHORT_TEXT -->
        <app-short-text 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.SHORT_TEXT"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-short-text>

        <!-- ESSAY_PLAIN_TEXT -->
        <app-essay 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.ESSAY_PLAIN_TEXT"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-essay>

        <!-- ESSAY_RICH_TEXT -->
        <app-essay 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.ESSAY_RICH_TEXT"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-essay>

        <!-- CHOICE_MATRIX -->
        <app-choice-matrix 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.CHOICE_MATRIX"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-choice-matrix>

        <!-- CLOZE_TEXT_IMAGE -->
        <app-label-image-with-text 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.CLOZE_TEXT_IMAGE"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-label-image-with-text>

        <!-- CLOZE_DROPDOWN_IMAGE -->
        <app-label-image-with-dropdown 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.CLOZE_DROPDOWN_IMAGE"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-label-image-with-dropdown>

        <!-- IMAGE_DRAG_AND_DROP -->
        <app-label-image-drag-and-drop 
            *ngIf="item.item_score?.item_type === transcriptQuestionTypes.IMAGE_DRAG_AND_DROP"
            [currentQuestion]="item"
            [currentQuestionIndex]="i + 1"
        ></app-label-image-drag-and-drop>
    </ng-container>
</div>

<div id="domready" *ngIf="transcriptData"></div>
