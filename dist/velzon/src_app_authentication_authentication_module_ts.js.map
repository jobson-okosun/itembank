<!-- auth-page wrapper -->
<div
  class="auth-page-wrapper auth-bg-cover py-5 d-flex justify-content-center align-items-center min-vh-100"
>
  <div class="bg-overlay"></div>
  <!-- auth-page content -->
  <div class="auth-page-content overflow-hidden pt-lg-5">
    <div class="container">
      <div class="row">
        <div class="col-lg-6">
          <div class="card overflow-hidden border-0">
            <div class="row g-0">
              <!-- end col -->

              <div class="col-lg-12">
                <div class="p-lg-5 p-4">
                  <div>
                    <!-- <h5 class="text-primary">Welcome Back !</h5> -->
                    <img
                      src="/assets/logo/EXPryLogoHor.png"
                      alt="exam-alpha-logo"
                      height="19"
                      class="mb-3"
                    />
                    <p
                      class="text-muted text-uppercase"
                      style="font-size: 12px"
                    >
                      Sign in to continue.
                    </p>
                  </div>

                  <div class="mt-4">
                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                      <div class="mb-3">
                        <label for="username" class="form-label"
                          >Username</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="username"
                          placeholder="Enter username"
                          formControlName="username"
                          [ngClass]="{
                            'is-invalid': checkSubmit && f['username'].errors
                          }"
                        />
                        <div
                          *ngIf="checkSubmit && f['username'].errors"
                          class="invalid-feedback"
                          align="left"
                        >
                          <div *ngIf="f['username'].errors['required']">
                            Username is required
                          </div>
                        </div>
                      </div>

                      <div class="mb-3">
                        <label class="form-label" for="password-input"
                          >Password</label
                        >
                        <div
                          class="position-relative auth-pass-inputgroup mb-3"
                        >
                          <input
                            [type]="fieldTextType ? 'text' : 'password'"
                            class="form-control pe-5"
                            placeholder="Enter password"
                            id="password-input"
                            formControlName="password"
                            [ngClass]="{
                              'is-invalid': checkSubmit && f['password'].errors
                            }"
                          />
                          <button
                            class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted"
                            type="button"
                            id="password-addon"
                          >
                            <i
                              class="mdi align-middle"
                              [ngClass]="{
                                'mdi-eye-off-outline': !fieldTextType,
                                'mdi-eye-outline': fieldTextType
                              }"
                              (click)="toggleFieldTextType()"
                            ></i>
                          </button>
                          <div
                            *ngIf="checkSubmit && f['password'].errors"
                            class="invalid-feedback"
                          >
                            <span *ngIf="f['password'].errors['required']"
                              >Password is required</span
                            >
                          </div>
                        </div>
                      </div>
                      <div class="mt-4">
                        <button
                          class="btn btn-success w-100"
                          type="submit"
                          [disabled]="submitted === true"
                        >
                          {{
                            submitted === false ? 'Sign In' : 'Signing in...'
                          }}
                        </button>
                      </div>

                      <div *ngIf="error" class="mt-4">
                        <p
                          class="alert alert-danger alert-dismissible fade show"
                        >
                          {{ error_msg }}
                        </p>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
              <!-- end col -->
            </div>
            <!-- end row -->
          </div>
          <!-- end card -->
        </div>
        <!-- end col -->
      </div>
      <!-- end row -->
    </div>
    <!-- end container -->
  </div>
  <!-- end auth page content -->

  <!-- footer -->
  <footer class="footer">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <div class="text-center">
            <p class="mb-0">
              &copy; {{ year }} Exam Alpha. Crafted with
              <i class="mdi mdi-heart text-danger"></i> by Multilent Software
            </p>
          </div>
        </div>
      </div>
    </div>
  </footer>
  <!-- end Footer -->
</div>
<!-- end auth-page-wrapper -->
